<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12B886">
  <meta name="description" content="복순이 - 신부전 고양이 음수량 및 피하수액 케어 관리">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="복순이 케어">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>복순이 - 신부전 고양이 음수량 케어</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .splash-cat {
      font-size: 48px;
      animation: pulse 1.8s infinite ease-in-out;
    }
    .splash-title {
      margin-top: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #212529;
      letter-spacing: -0.3px;
    }
    .splash-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #868E96;
    }
    .splash-bar {
      margin-top: 20px;
      width: 120px;
      height: 3px;
      background: #E9ECEF;
      border-radius: 2px;
      overflow: hidden;
    }
    .splash-bar-inner {
      width: 100%;
      height: 100%;
      background: #12B886;
      animation: progress 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes progress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-cat">🐱💧</div>
    <div class="splash-title">복순이 케어</div>
    <div class="splash-sub">신부전 음수량 관리 불러오는 중...</div>
    <div class="splash-bar">
      <div class="splash-bar-inner"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
